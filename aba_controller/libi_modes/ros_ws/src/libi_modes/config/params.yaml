libi_modes:
  # 관제 패널이 시킨 전이를 이 시간(초)만큼 붙잡는다. 그 동안 BT 는 스스로 상태를 못 바꾼다.
  #
  # 없으면 패널에서 눌러도 같은 tick 에 되돌아가 화면상 아무 일도 안 일어난다:
  #   CHARGING         이미 충전돼 있으면 BatteryCheck(>=40) 이 즉시 통과 → IDLE
  #   SECURITY_PATROL  랩 드라이버가 곧바로 success → SetNextMode(IDLE) → IDLE
  #
  # ⚠️ 로봇이 스스로 못 나가는 것이지 조작이 잠기는 게 아니다 — 사람은 유지 중에도
  #    다른 상태로 바꿀 수 있다(패널 전이는 이 관문을 안 거친다).
  # ⚠️ ERROR·RETURNING 은 막지 않는다(request_transition._ALWAYS_ALLOWED).
  #    고장과 저전압 복귀는 사람이 정한 상태보다 우선한다.
  # 0 이면 기능이 꺼진다(예전 동작).
  #
  # [2026-07-30] 2.0 → 300.0. **2초는 "눈에 보이게"만 하는 값이라 실제로는 못 쓴다.**
  #   실측(pinky-3, 배터리 100%): 관제에서 IDLE 로 보내면
  #     수동 전이 적용 → IDLE   …   2초 뒤   IDLE -> PATROL
  #   즉 IdleBranch 의 `BatteryCheck(>=80 → PATROL)` 이 도크 게이트 없이 걸려 있어
  #   배터리가 충분하면 IDLE 이 2초만 살아 있었다. 관제 화면에서는 "전이가 안 먹는다"로
  #   보였다(수락은 됐는데 로봇이 되돌린 것).
  #
  #   자동 전이 규칙 자체는 **그대로 둔다** — 부팅·충전 후 자동 순회는 계속 필요하다.
  #   대신 사람이 정한 상태가 사람이 다시 바꿀 때까지 남을 만큼 유지 시간을 늘린다.
  #   미루는 것이지 버리는 게 아니라, 유지가 끝나면 원래 자동 전이가 그대로 일어난다.
  manual_hold_sec: 300.0
  battery:
    ready: 40         # CHARGING -> IDLE
    charged: 80       # IDLE -> PATROL (auto, docked only)
    low: 15           # -> RETURNING
  interacting:
    ui_idle_timeout_sec: 20
  working:
    command_timeout_sec: 120
    # NavigationExec 의 도착 판정 반경(m). **fleet_node 의 arrive_radius 와 같은 값을 쓴다.**
    #   같은 뜻("도착했다")을 두 곳이 판단하는데 값이 다르면 반드시 어긋난다.
    #   BT 가 더 관대하면(값이 크면) 관제는 아직 주행 중인데 BT 는 명령을 놓아 버리고,
    #   BT 가 더 엄격하면 관제가 다음 노드를 줬는데 BT 는 이전 목적지를 붙들고 있다.
    #   또 이 값은 **최소 레인(0.062m)보다 작아야** 옆 노드와 구분이 된다.
    #   전체 부등식:
    #     update_min_d(0.02) < xy_goal_tolerance(0.05) < arrive_tolerance_m = arrive_radius(0.07)
    #                                                                       < 최소 레인(0.062) (현장 요청값은 오인식 점검 필요)
    arrive_tolerance_m: 0.07
    # 도착하지 않은 채 이 시간이 지나면 같은 목적지로 goal 을 **다시** 낸다.
    #   nav2 주행은 도착 없이 끝날 수 있다(ABORTED, 또는 선점 순간 직전 목표의 완료가
    #   새 목표의 완료로 보고되는 경우). 그때 다시 몰아 줄 주체가 필요하다.
    #   재전송은 **BT 가 해야 한다** — 도착 여부를 아는 건 BT 뿐이라, FMS 가 시간만 보고
    #   보내면 정상 주행 중에도 끼어들어 불필요한 선점을 만든다.
    #   실측 정상 홉은 2~17초다. 그보다 넉넉히 잡는다.
    #
    # [2026-07-28] 10 → 30. **10 은 위 문장과 어긋났다** — 정상 홉 상한(17초)보다 작아서
    #   정상 주행 중에 재전송이 끼어들었다. 재전송은 fleet_link 에서
    #   `NavGoalTracker.begin()` 이 이전 핸들을 먼저 취소하는 경로라(nav_goal_tracker.py:31)
    #   목적지가 바뀔 때의 매끄러운 preemption 과 달리 **주행이 끊긴다.**
    #
    #   특히 회전과 겹쳐 악순환이 됐다: 90° 제자리 회전이 10.5초(당시 0.15 rad/s)인데
    #   재전송이 10.0초에 나가 회전을 취소하고 처음부터 다시 시켰다 — 영영 안 끝났다.
    #   회전 속도도 0.5 rad/s 로 같이 올렸다(nav2_params.yaml max_angular_vel 주석).
    #
    #   대가: 진짜 nav2 ABORTED 뒤 재주행까지 최대 30초 기다린다. 그래도
    #   `arrive_timeout_sec: 60` 이 있어 영구 정지는 안 된다.
    arrive_resend_sec: 30
    # 목적지가 바뀐 뒤 이 시간 안에 도착 못 하면 그 주행을 실패로 본다.
    #   없으면 "아직 가는 중"과 "영영 못 감"이 구별되지 않아 로봇이 조용히 선다.
    arrive_timeout_sec: 60
    # goal 접수 유실·Nav2 순간 abort 때 같은 명령을 이 횟수만큼 자동 복구한다.
    # 모두 실패하면 ERROR 경로로 보내 조용히 멈춰 있지 않게 한다.
    recovery_retry_max: 3
    # 이 시간 동안 목표 방향으로 1cm도 가까워지지 않으면 조기 재시도한다.
    # 0이면 끈다. 사람 감시로 정지한 경우에는 pause_arrive_timer가 시계를 멈춘다.
    recovery_stall_sec: 20
    # ── 요청자를 놓쳤을 때의 세 단계 (사용자 스펙 2026-08-02) ────────────────
    #
    #   [0, coast)              α-β 예측으로 **계속 간다** — 잠깐 가린 것
    #   [coast, coast+wait)     **정지하고 기다린다**
    #   [coast+wait, …)         회복 BT 에 바퀴를 넘긴다 (한 라운드 ≈32.8초)
    #   회복이 다 훑고도 못 찾으면 `/libi/guide_search_failed` 로 안내가 끝난다
    #
    # ⚠️ [2026-08-02] 예전에는 `guide_lost_grace_sec`(20초) 하나였고, 그 구간에서
    #    로봇이 **계속 주행했다** — 주석은 "서서 기다린다" 였는데 코드는 반대였다.
    #    사람을 놓친 채 20초를 더 가고, 그 뒤에야 nav2 를 끊었다. 두 값으로 나눠
    #    "가는 시간" 과 "서는 시간" 이 이름부터 갈라지게 한다.

    # α-β 예측으로 계속 가는 시간. 서가·기둥에 잠깐 가리는 것을 흡수한다.
    #   `libi_perception` 의 `GUIDE_COAST_SEC`(1.4) 와 **같은 값**이어야 한다 —
    #   그쪽은 제어 루프의 코스팅, 이쪽은 nav2 주행의 코스팅이고 같은 사건을 잰다.
    #   다르면 한쪽이 이미 포기한 뒤에 다른 쪽이 아직 달린다.
    guide_coast_sec: 1.4
    # 코스팅이 끝난 뒤 **서서 기다리는** 시간. 다 지나면 회복 BT 가 돈다.
    #   길잡이는 로봇이 앞서 가고 사람이 뒤따르는 구조라 잠깐 가려지는 일이 추종보다
    #   잦다(서가·기둥·모퉁이). 그냥 뒤처진 사람은 대개 이 안에 다시 나타난다.
    #
    # ⚠️ [2026-08-02] 20.0 → 5.0 (사용자 지시). 20초는 **회전 탐색이 없는 것처럼
    #    보이게** 만들었다. 회복 트리 앞머리도 `HoldFront`+`HoldBack` 으로 10초를
    #    서 있으므로(`libi_perception/config.py` `SEARCH_HOLD_SEC=5.0` ×2), 대기가
    #    20초면 사람을 놓친 뒤 **31.4초가 지나야 로봇이 처음 돈다.** 그 전에 보던
    #    사람은 "안 돈다" 로 읽는다. 5초로 줄이면 첫 회전이 16.4초로 당겨진다.
    guide_wait_sec: 5.0
    # [2026-08-02] `guide_lost_timeout_sec` **삭제됨.**
    #
    #   회복 탐색에 시계로 제한을 두던 값이다. 회복 BT 가 언제 끝나는지 아무도 안
    #   알려줘서 시간으로 대신 잘랐는데, 그러니 트리 타임라인을 고칠 때마다 이 숫자를
    #   손으로 다시 맞춰야 했고 실제로 어긋나 있었다(코드 주석 45초, 여기 40).
    #
    #   이제 회복이 스스로 말한다 — `/libi/guide_search_failed`(Bool) 를
    #   `follow_node._publish_guide_search_failed` 가 매 tick 내고 `GuideExec` 이
    #   그걸로 안내를 끝낸다. 시계가 아니라 사건이다.
    # 요청자 가시성(`/libi/requester_visible`)의 신선도. 이보다 오래 갱신이 없으면
    # **False(정지)** 로 본다.
    #   ⚠️ None(감시 없음)으로 내리면 안 된다 — GuideExec 이 "감시 없음 → 그냥 주행"으로
    #      읽어서, AI 서버가 죽었을 때 로봇이 사람 없이 계속 몰고 간다.
    #   카메라 15fps + 발행 주기를 감안해 몇 초를 준다.
    requester_ttl_sec: 2.0
    # 요청자가 이보다 작게 보이면(= 멀면) 멈춰 기다린다. bbox 면적(px^2).
    #   "보이나" 만 보면 10m 뒤에 있어도 계속 간다 — 안내가 아니라 혼자 가는 것이다.
    #   ⚠️ **실측 전이라 0(끔)이 기본이다.** 근거 없는 임계로 멈추면 "왜 안 가지"를
    #      찾느라 시간을 버린다. 로봇 앞 적정 거리에서 면적을 재서 채운다.
    guide_far_area_min: 0
    # 앞을 막은 사람이 이보다 크게 보이면(= 가까우면) 멈춘다. 0 이면 끔(기본).
    #   조종하지 않고 **멈추기만** 한다 — 우회는 nav2 가 costmap 으로 한다.
    guide_near_area_max: 0
    # 갈림길에서 잠깐 서서 사람을 확인하는 시간(초). 0 이면 끔.
    #   **모든 노드가 아니라 갈림길만** — arte2 레인이 0.151~0.601m 라 모든 노드에서
    #   서면 1~5초마다 멈춰 안내가 계속 끊긴다.
    guide_junction_hold_sec: 1.0
    # ── 주행 중 사람 차단 (2026-08-03) ────────────────────────────────────
    # 크기는 sqrt(area) 픽셀(320 원본 기준). 클수록 **가까이 와야** 멈춘다. 0 이면 끈다.
    #
    # 처음엔 209 였다 — 추종이 후진을 시작하는 지점(libi_perception/config.py 의
    # TARGET_SIZE 169 + DIST_DEADZONE 30 = 199)에 10 을 더한 값.
    #
    # 실측(2026-08-03, 패널 화면 계측): 사람이 "이쯤이면 서야 한다" 싶은 자세에서
    # bbox 가 원본 기준 약 135x229 = **√area ≈ 176px** 였다. 209 도 194 도 안 걸렸다.
    # 여유를 두고 **170** 으로 내린다.
    #
    # ⚠️ 이제 추종의 후진 시작점(199)보다 **낮다.** 두 값은 서로 다른 모드에서 쓰여
    # 충돌하지 않지만(추종은 등록된 주인, 이건 주행 중 아무나), 209 를 "199+10" 으로
    # 설명하던 근거는 더 이상 유효하지 않다. 지금 근거는 **실측**이다.
    # 관리자 화면의 카메라 배지 옆에 지금 px 이 실시간으로 뜬다 — 그걸 보고 맞춘다.
    person_stop_size: 170.0
    # 이만큼 계속 막고 있으면 FMS 에 정점 차단을 알린다.
    person_sustain_sec: 10.0
    # 비켜도 이만큼 확실히 비켜야 다시 출발한다. 검출 깜빡임을 흡수한다.
    person_resume_grace_sec: 1.0
    # 차단을 알릴 때 함께 보내는 유효시간. 지나면 FMS 가 스스로 푼다.
    person_block_ttl_sec: 60.0
    # [codex P1] `/libi/front_person_size` 신선도(초). 이보다 오래 갱신이 없으면
    #   PersonBlockGuard 는 그 값을 None(안 보인다)으로 읽는다 — requester_ttl_sec 과
    #   같은 급. 검출 파이프라인·도메인 브릿지가 죽었을 때 마지막 값이 영원히 남아
    #   유령 앞에서 계속 멈추고 차단까지 보고하는 것을 막는다.
    front_person_size_ttl_sec: 2.0
  returning:
    dock_retry_max: 3
    # 회전 단계(FaceApproachYaw)의 각도 허용오차(rad). 약 8.6도.
    yaw_tolerance_rad: 0.15
    # ② 접근 자세(절대각, rad). 이 각도로 서면 **충전 단자가 뒤를 향하고** 뒷캠이 마커를 본다.
    #   0.0 = 맵 기준 접근 방향. 충전소 입구의 실제 접근 방향이다.
    #   ⚠️ 이 값이 틀리면 뒷캠에 마커가 안 잡혀 ③이 timeout 까지 서 있는다.
    #      증상이 "입구에서 돌고 멈춤"이면 여기부터 의심한다.
    # 비워 두면 **접근 정점 yaw + 180°** 로 유도한다(권장). 값을 적으면 그게 이긴다.
    #   유도가 맞는 이유: 정점 yaw 가 충전소를 바라보므로 반 바퀴 = 뒷캠이 충전소를 봄.
    #   하드코딩하면 정점을 옮겼을 때 조용히 어긋난다 — 실제로 `충전소입구`(0.6005) 에서
    #   `충전소통로`(0.384) 로 옮겼고, 둘 다 yaw 가 π 라 우연히 0.0 이 계속 맞았다.
    # ★ 현장 실측 (2026-08-03, pinky-3) — 상대 180도 유도가 이 입구에서는 틀렸다.
    #   실측: ①②를 거친 뒤 로봇 **정면**이 도크를 보고 있었다(사용자 확인, AMCL yaw
    #   약 175도). 현장 기준 접근 자세는 맵 기준 0.0으로 고정한다.
    #   ⚠️ 입구 좌표(`return_x`/`return_y`)를 옮기면 이 값도 다시 확인해야 한다.
    # 충전소입구 도착 뒤, 도킹 전 맵 기준 -X 방향(yaw=π)을 보게 한다.
    # AMCL 값을 덮어쓰는 것이 아니라 `return_rotate`가 향할 목표각이다.
    approach_yaw_rad: 0.0
    # ④ 외부 저장소의 ArUco 정밀 접근(6cm 까지) 응답 상한(초).
    #   마커 탐색·정렬·저속 접근을 다 포함하므로 넉넉해야 한다.
    #   ⚠️ 이 시간이 지나 실패로 처리해도 **상대가 멈춘다는 보장은 없다.** `stop` 은
    #      fleet_link 에서 nav2 만 끊는다. 재시도가 이전 접근과 겹칠 수 있으니, 외부
    #      노드를 붙일 때 취소 계약(cancel + ack)을 같이 정할 것.
    aruco_timeout_sec: 180.0
    # ④ 정밀 도킹을 무엇으로 하는가 — **되돌리기 스위치는 이것 하나뿐이다.**
    #   aruco : 뒷캠 ArUco (robot_agent 의 marker_dock 이 수행. 2026-07-31 실기 성공)
    #   lidar : 라이다 노치 (libi_modes/lidar/. 이 저장소가 수행)
    #
    #   ⑤ `nudge_distance_m` 은 여기서 유도한다 — lidar 면 main.py 가 0 을 강제한다.
    #   라이다는 마지막까지 노치를 보므로 눈 감고 미는 구간이 없다. 0 이면 `NudgeDriver`
    #   가 첫 tick 에 곧장 0 구간으로 가 0 을 6번 내고 success 다
    #   (`fleet_cmd_driver.py:265-278`). **노드를 지우지 않고 무해화**하므로 BT 트리
    #   모양이 그대로고 관제 화면이 안 바뀐다.
    dock_sensor: lidar

    # 라이다 노치 도킹 — 값의 근거는 docs/superpowers/specs/2026-08-03-*-design.md
    lidar_dock:
      # ── 섹터 ──
      sector_half_deg: 60.0
      range_max_m: 1.5
      min_points: 20
      # 노치 확정 실패 시, 같은 자세에서 반복하지 않고 제자리로 좌·우를 훑어
      # 다른 빔 입사각에서 다시 찾는다. 이동은 전혀 하지 않아 도크에 가까워지지 않는다.
      acquire_recovery_max: 3
      # 현재 접근 자세(yaw=π)에서 재검출한다. 좌우 회전으로 이미 맞춘
      # 맵 방향을 잃지 않는다.
      acquire_recovery_sweep_rad: 0.0
      acquire_recovery_settle_s: 0.30
      # ── 벽 직선 (RANSAC) ──
      #   ★ 현장 실측 완료 (2026-08-03, pinky-3). 벽거리 9~11cm 구간에서 원래 값
      #     (50회·1cm)은 5/5 스캔 전부 벽을 잘못 잡았다(yaw 실제 ~1~2도인데 -7도로
      #     오판) — 200회·6mm 부터 5/5 정상 검출, 300·500회와 결과 동일해 수렴 확인.
      ransac_iters: 200
      ransac_inlier_m: 0.006
      #   ⚠️ [2026-08-04 실측 정정] 0.30·35°·15mm 이던 값 — 실기: 검출 실패가
      #     너무 잦고 성공 거리도 짧았다. 오검출은 화면 보고 사용자가 직접
      #     잡기로 하고 문턱을 넓힌다.
      ransac_min_inlier_ratio: 0.20
      wall_yaw_max_rad: 0.87
      wall_rms_max_m: 0.025
      # ── 탐색 (SEARCH, 임의 자세에서 벽·노치 찾기) ──
      #   ★ 현장 실측 (2026-08-03, pinky-3) — 접근 전 회전이 목표각 못 미친 채
      #     넘어와 벽 yaw -40.7도(위 wall_yaw_max_rad 35도 초과)로 반복 실패했다.
      #     nav2 회전 정밀도에 안 기대고 라이다가 넓은 창으로 스스로 찾아 정렬한다.
      search_half_deg: 175.0
      search_wall_yaw_max_rad: 3.2
      #   ⚠️ [2026-08-04 실측 정정] 0.4(22.9도)→0.15(8.6도) — 클릭 라벨링으로 재보니
      #     노치 y 오차가 벽 yaw 에 거의 선형 비례했다(상관계수 0.93, 1도당 2.4mm).
      search_align_tol_rad: 0.15
      search_rot_rad_s: 0.25
      search_timeout_s: 30.0
      #   ⚠️ [2026-08-04 실측 추가] `fit_wall_near_bearing` 전용 — inlier 최다만
      #     보면 도크와 무관한 방의 다른 벽을 우선할 수 있다(실측: 200점 옆벽이
      #     110점 도크벽을 이김, codex P1 확인). 벽의 기울기는 여전히 넓게
      #     허용하되(search_wall_yaw_max_rad), 벽 점들의 방향·거리는 제한한다.
      #     아직 1차 추정치 — 라벨 데이터 쌓이면 좁힐 것.
      search_bearing_tol_rad: 1.05
      search_wall_dist_min_m: 0.05
      search_wall_dist_max_m: 1.0
      #   ⚠️ [2026-08-04 실측, 두 번째 결함] ransac_min_inlier_ratio(비율)를 넓은
      #     섹터(175도)에 그대로 쓰면 전체 점수 n 이 커져서(실측 689) 그 30%(≈207)를
      #     요구하게 된다 — 실제 도크 벽은 그 안에서 87개뿐이라 bearing·dist 게이트를
      #     다 통과해도 계속 None 이 났다(dock_scan_visualize 15초 캡처로 재현).
      #     섹터 폭에 안 흔들리는 절대 개수로 바꾼다.
      search_wall_min_inliers: 30
      # ── 노치 (실측: 폭 6cm · 깊이 2.5cm) ──
      smooth_rays: 5
      notch_thresh_m: 0.012
      #   ⚠️ [2026-08-04 실측 정정] 0.015/0.040/0.03/0.10 이던 값 — 너무 보수적
      #     이라 성공 실패가 잦았다. notch_depth_min_m 은 notch_thresh_m(0.012)
      #     보다는 커야 한다(안 그러면 두 문턱이 하는 일이 안 갈린다).
      notch_depth_min_m: 0.013
      notch_depth_max_m: 0.045
      notch_width_min_m: 0.025
      notch_width_max_m: 0.12
      # ── NEAR 모드 (벽이 min range 아래로 사라진 뒤 인수인계) ──
      near_half_deg: 35.0
      near_gap_m: 0.02
      near_width_min_m: 0.02
      near_width_max_m: 0.10
      # ── 필터 ──
      #   0.3 이 아니라 0.5 다 — 지연 시뮬레이션에서 0.3 은 과주행 중단 6/60,
      #   1.0 은 산포 4.4mm. 편향은 stop_m 이 흡수하고 분산은 안 지워진다.
      ema_coef: 0.5
      #   ⚠️ [2026-08-04, 사용자 지적] (d,y) 를 재는 기준선(그 프레임의 RANSAC
      #     wall.yaw) 자체가 프레임마다 흔들려 로봇이 안 움직여도 y 가 흔들리는
      #     문제 — ema_coef 보다 훨씬 느린 별도 계수(approach.py:_stabilize()).
      wall_yaw_ref_coef: 0.08
      #   튐 게이트는 경과 시간에 비례한다(고정값이면 스캔 결손 뒤 정상 관측을 버린다).
      jump_speed_max_mps: 0.5
      jump_gate_y_m: 0.03
      jump_gate_yaw_rad: 0.17
      confirm_frames: 3
      lost_frames_max: 10
      # ── 국면 ──
      #   벽면이 C1 min range(5cm) 아래로 가기 전에 yaw 보정을 끝내야 한다.
      wall_alive_min_m: 0.08
      #   FAR 가 살아 있는 동안 이만큼 안에 들어와야 FINAL 로 넘어간다.
      y_max_enter_final_m: 0.015
      #   ⚠️ [2026-08-04 실측] y 오차가 yaw 에 비례한다(§10, 1도당 2.4mm) — yaw 가
      #     크면 y 값 자체를 못 믿는다. 실측: yaw=12.8도에서 y=24mm(문턱 안)로
      #     통과했는데 실제로는 물리 접촉이 났다. SEARCH 와 같은 값(8.6도)을 쓴다.
      #   ⚠️ [2026-08-04 실기, 재정정] 8.6도로 진입시켰더니 FINAL 은 yaw 를
      #     못 고친다(k_yaw_final=0, 벽이 사라져 애초에 못 잰다) — 6.2°로
      #     들어가서 16.4°까지 더 벌어진 채 도착했다. 진입 뒤엔 교정 수단이
      #     없으므로 진입 시점에 최대한 0에 가깝게 좁힌다.
      #   ⚠️ [2026-08-04 실기, 3차] 2도가 너무 빡빡해서 y=11mm·yaw=-2.0°(거의
      #     다 맞은 케이스)까지 걸러냈다 — 3도로 살짝 푼다. 큰 각도(실기
      #     yaw=-21.3°)는 이 값을 더 풀어도 안 통과함 — 그건 별개 문제.
      yaw_max_enter_final_rad: 0.0524
      #   ⚠️ [2026-08-04, codex 검토] "정지해서 y를 맞춘다"는 물리적으로 반박당했다
      #     — 제자리 회전은 yaw만 바꾸고 y는 거의 못 바꾼다. 로봇은 계속 움직이며
      #     조향하게 두고, 근접 구간(pulse_dist_m 안)에서 "정렬됐다"를 연속
      #     N프레임으로 확인한다. 못 채우면 90초 전체 타임아웃까지 안 끌고
      #     여기서 먼저 ABORT — 실패 판정을 앞당겨 재시도 여지를 남긴다.
      waypoint_align_confirm_frames: 3
      waypoint_align_timeout_s: 5.0
      #   ⚠️ [2026-08-04, 사용자 요청] 정렬 게이트가 막으면 바로 ABORT 하지
      #     말고 그 트리거일 때만 짧게 물러났다가(RETREAT) ALIGN 으로
      #     복귀해 재시도한다 — Cmd.linear 의 "항상 ≤0" 은 전역으로 안 풀고
      #     이 국면 안에서만 예외. 횟수 제한, 다 쓰면 원래대로 ABORT.
      waypoint_retry_max: 2
      #   ⚠️ [2026-08-04, 사용자 요청] 물러나는 거리는 시간이 아니라
      #     v_far_dist_m 까지 — 우선순위 램프가 그 지점을 "먼 구간" 기준으로
      #     쓰므로 거기까지 물러나면 y 가 자연스럽게 맞춰질 여지를 곧바로
      #     받는다. 이 값은 최대 시간 상한(안전판)일 뿐이다.
      waypoint_retreat_s: 5.0
      #   ★ 현장 실측 완료 (2026-08-03, pinky-3, 도크 앞). 실제 충전 접촉 핀은 아직
      #     없다 — "라이다가 홈 끝점 0.5cm 앞까지 들어가면 도킹"으로 판정하기로
      #     사용자가 정했다(사용자 결정, 실제 전기 접촉 테스트 아님).
      #     로봇 뒷면(라이다 있는 자리)에 손을 대고 스캔 뜬 실측값이 4.4~4.6cm —
      #     라이다 원점 ↔ 로봇 뒷면 표면 오프셋이다.
      #   ⚠️ [2026-08-04 실측 정정] 5.0cm(여유 0.5cm) → 6.0cm(여유 1.5cm) —
      #     C1 min range(5cm) 바로 위 경계값이라 여유가 너무 빠듯했다. 실기
      #     테스트로 마진을 더 두기로 사용자가 정했다.
      #   ⚠️ [2026-08-06] 최종 정지거리 5.5cm로 조정 — 충전 접점 여유를 줄인다.
      #     못 고쳐진 채 벌어지는 실기가 확인돼(위 yaw_max_enter_final_rad
      #     참고) 여유를 0.5cm 더 둔다.
      #   ⚠️ [2026-08-06] 5.5cm에서 5.8cm로 조정 — 사용자 요청.
      stop_m: 0.058
      overshoot_margin_m: 0.010
      #   ⚠️ [2026-08-04, 사용자 요청] 노치 검출(`d`)은 추정값 — 오늘 밤 그걸로
      #     실제 접촉이 났다. 정렬 상태와 무관하게 라이다 원시 최소거리가
      #     이 아래면 즉시 선다(approach.py 안전 정지, detect.min_range_m).
      safety_clearance_m: 0.01
      y_max_final_m: 0.030
      #   ⚠️ [2026-08-04, 웨이포인트] stop_m 바로 앞부터는 y·yaw 조향을 끄고
      #     직진만 한다 — 마지막에 확 꺾이는 위험한 경로를 막는다(사용자 스케치).
      #     5cm → 10cm(너무 널널함) → 0.5cm → 6cm → 7cm(y 를 더 확실히 맞추려고
      #     1cm 더, yaw 우선순위 램프의 여유 거리도 같이 늘어난다).
      #   ⚠️ [2026-08-06, 사용자 요청] 조향 종료점을 11cm 로 좁힌다 —
      #     stop_m(6cm)+이 값(5cm)=11cm 지점.
      waypoint_margin_m: 0.05
      # ── 속도 ──
      #   ⚠️ v_near_mps 는 **실측 모터 데드밴드**다. 더 낮게 적으면 명령은 나가는데
      #      바퀴가 안 돈다. 감속은 속도가 아니라 펄스 듀티로 한다.
      v_far_mps: 0.10
      v_near_mps: 0.05
      v_far_dist_m: 0.30
      pulse_dist_m: 0.15
      pulse_min_s: 0.10
      pulse_max_s: 0.40
      #   ⚠️ [2026-08-04 실측] 쉬는 동안은 조향도 강제로 0 이다(lin_mag==0 이면
      #     정지마찰 이유로 조향도 0). 0.30초면 밀기:쉬기가 최대 1:3 이라 조향이
      #     걸리는 시간이 25% 뿐이었다("게인 올려도 덜 간다"는 실기 관찰과 일치).
      # 근접 구간은 정지-재출발 펄스 대신 연속 저속 후진으로 운용한다.
      # stop_m/overshoot/safety_clearance 조건은 여전히 즉시 정지한다.
      pulse_pause_s: 0.0
      # ── 조향 ──
      #   ★ 현장 실측 완료 (2026-08-03, pinky-3). rplidar_link 가 z축 π 회전이라
      #     좌우가 로봇 기준과 뒤집힌다 — 기존 ArUco 도킹도 `_STEER_SIGN` 을 같은
      #     이유로 현장에서 정했다.
      #     실측 방법: cmd_vel_dock 에 양의 각속도(+0.2 rad/s)를 실제로 넣어 로봇
      #     정면(LCD) 기준 자기 왼쪽으로 도는 것을 확인 → 180도 회전 관계(y_lidar =
      #     -Y_body)로 역산 → steer_sign=+1.0. 기존 ArUco `_STEER_SIGN=+1` 과
      #     교차검증됨(같은 뒷면 마운트 조건, 다른 센서, 같은 부호).
      steer_sign: 1.0
      #   ⚠️ [2026-08-04 실측 정정, 2차] 1.2·0.08 → 2.0·0.12 로 한 번 올렸는데도
      #     실기에서 중앙에 못 붙는다는 관찰이 있어 한 번 더 올린다. 진동·
      #     오버슈트(좌우로 홱홱) 보이면 역으로 낮춰야 한다는 신호다.
      #   ⚠️ [2026-08-04 실측 정정, 4차] 조향 종료점 12cm(waypoint_margin_m) 전에
      #     y 수렴을 못 끝내 FINAL lateral_too_large ABORT 실기 확인 — 세게 올린다.
      k_y: 4.0
      #   ⚠️ [2026-08-04 실기, 5차] k_y(4.0)가 k_yaw_* 보다 훨씬 커서 조향이
      #     y 쪽으로 쏠렸다 — 실기: y=4mm(거의 맞음)인데 yaw=-10.6° 는 그대로
      #     남아 존 진입 게이트(2도)에 계속 막혔다. yaw 항 기여를 y 항과
      #     비슷한 크기로 올린다.
      k_yaw_align: 2.0
      k_yaw_approach: 1.2
      #   ⚠️ [2026-08-04 실기, 6차] k_y*y + k_yaw*yaw 를 그냥 더하면 두 항이
      #     서로 싸운다 — y 를 줄이려면 로봇이 잠깐 비스듬히 틀어야 하는데
      #     yaw 항이 동시에 그걸 0으로 당긴다. 실기: d=343mm 에서 yaw=+0.4°
      #     (거의 완벽)인데 y=+29mm 그대로였다. 멀 때는 yaw 게인을 낮춰
      #     각을 허용, 존 경계에 가까워질수록 원래 값으로 램프업한다.
      k_yaw_far_scale: 0.25
      k_yaw_final: 0.0
      ang_max_rad_s: 0.35   # [2026-08-04, 4차] 0.22 → 0.35
      #   ⚠️ [2026-08-04, codex 검토] max 를 더 푸는 대신 출력 변화율을 제한한다
      #     (P 제어라 D 없음 — 관측을 미분 안 하고 홱홱 튀는 것만 억누른다).
      ang_slew_max_rad_s2: 2.0
      # ── 시간 ──
      #   설계 시뮬레이션이 가정한 3초 — nav2 잔여 감속이 완전히 죽을 시간을 준다.
      settle_sec: 3.0
      acquire_timeout_s: 3.0
      #   ⚠️ [2026-08-04, 사용자 요청] 90초 → 300초 — RETREAT 재시도까지 감안하면
      #     90초는 실기에서 거의 다 맞춰놓고도(d=100mm, y≈0, yaw=0.7°) 이
      #     타임아웃에 먼저 걸릴 수 있었다.
      timeout_s: 300.0
      scan_timeout_s: 0.5
      loop_hz: 10.0
    # ⑤ 마커가 화각을 벗어난 마지막 구간. 개루프로 민다.
    #   부호가 방향이다 — **음수 = 후진**(충전 단자가 뒤).
    #   지금 값: 3cm 를 0.08m/s 로 → **0.375초**.
    #
    #   0.08 을 고른 이유: **실측 모터 데드밴드가 0.05 m/s** 다(마커 도킹 현장 튜닝의
    #   `LIN_PULSE`. "이 아래로는 안 돈다"를 실기에서 재서 얻은 값이다). 그 위 여유를
    #   두려고 0.08 로 잡았고, 공교롭게 nav2 의 `regulated_linear_scaling_min_speed`
    #   와도 같은 값이다. 더 느리게(예: 0.01) 두면 정지마찰에 걸려 명령은 20Hz 로
    #   나가는데 바퀴가 안 돌거나 툭툭 끊긴다.
    #
    #   참고 — 현장 도킹은 **펄스**로 움직인다: 0.05 m/s × 0.4s = 2cm 한 걸음.
    #   여기 0.375초는 그 펄스 길이와 거의 같으므로, "이 정도 길이의 한 걸음은 실기에서
    #   실제로 나간다"가 이미 확인된 셈이다. 다만 펄스는 **걸음마다 다시 보기 위한** 것이고
    #   여기는 마지막 한 걸음이라 한 번에 민다.
    #
    #   ⚠️ 대신 **관성이 커진다.** 명령이 끊긴 뒤 twist_mux(0.5s)·모터 워치독(0.5s)이
    #      세울 때까지 0.08m/s 면 최대 4cm 를 더 간다 — **이동량보다 크다.** 그래서
    #      `NudgeDriver` 가 주행 뒤 0 을 반드시 발행한다(개수로 센다). 그 보호를 빼면
    #      3cm 를 재는 의미가 통째로 사라진다.
    #
    #   ⚠️ **실측 보정 필수.** 개루프라 슬립만큼 그대로 어긋나고, 0.375초는 짧아서
    #      기동/정지 과도구간의 비중이 크다.
    #      절차: 로봇을 평지에 놓고 ⑤만 한 번 돌린 뒤 자로 잰다.
    #      3cm 보다 덜 가면 거리를 늘리고(속도는 0.08 유지), 더 가면 줄인다.
    nudge_distance_m: 0.03
    nudge_speed_mps: -0.08
    # ⑥ 미세 이동 뒤 안정화 대기(초). 이 시간이 지나면 도킹으로 치고 CHARGING 으로 간다.
    #   ⚠️ `is_docked` 를 **안 본다**(2026-07-30 사용자 결정). 그 신호는 주차장 정점 반경
    #      0.12m 판정이라, ④⑤를 거친 뒤에는 이미 참이라 아무것도 검증하지 못한다.
    #      진짜 접촉 확인(충전 전류 등)이 생기면 그때 이 대기를 그 신호로 바꾼다.
    #   ⚠️ **접점이 안 붙어도 CHARGING 을 선언한다.** ChargingBranch 의 이탈 조건은
    #      fault 또는 battery >= ready 뿐이라, 충전이 안 되면 방전까지 갇힌다.
    #      "일정 시간 배터리가 안 오르면 fault" 감시는 아직 없다.
    settle_sec: 1.0
    # ── 도킹 탈출(Undock) ────────────────────────────────────────────────────
    # 나갈 때 앞으로 미는 거리(m). 속도는 nudge_speed_mps 의 절댓값을 쓴다.
    #   벽에서 9cm 안쪽은 nav2 costmap 이 통행불가(253)다
    #   (robot_radius 0.06 + footprint_padding 0.03 = inscribed 0.088 < inflation 0.09).
    #   도킹 완료 시 로봇 뒷면이 벽에서 1cm → **중심은 1 + robot_radius(6) = 7cm** 다.
    #   7cm < inscribed 8.8cm 이므로 그 자리에서는 nav2 가 경로를 아예 못 낸다.
    #     6cm  밀면 중심 13cm — inflation 9cm 밖, 여유 4cm
    #     10cm 밀면 중심 17cm — 여유 8cm   ← [2026-07-31] 사용자 결정으로 이쪽
    #   AMCL 오차·바퀴 슬립이 개루프 이동량을 갉아먹으므로 여유를 두는 편이 맞다.
    #   ⚠️ 줄이려면 먼저 nav2_params.yaml 의 inflation_radius 를 보라. 그 값보다
    #      중심 거리가 커야 한다. inflation 은 0.088 미만으로 못 낮춘다(nav2 가 죽는다).
    undock_distance_m: 0.10
    # 개루프로 **더 많이** 명령한다. 실이동은 명령값보다 항상 조금 적기 때문이다
    # (가속 램프·바퀴 슬립·모터 데드밴드). 예전엔 명령과 판정이 같은 값이라 여유가 0 이었고,
    # 그래서 **한 번에 성공하는 일이 드물었다** — 실측 2026-07-31: 전이할 때마다 앞으로
    # 세 번 나갔다(재시도 2회 + 성공 1회). 재시도는 기준점을 새로 잡으므로 30cm 를 갔다.
    #   명령 = undock_distance_m + 이 값 = 15cm
    #   판정 = undock_distance_m        = 10cm   ← 안전에 필요한 값은 이쪽이다
    # 앞은 통로라 5cm 더 가는 것은 안전하다. 이 값을 0 으로 되돌리면 3번 밀기가 돌아온다.
    undock_slip_margin_m: 0.05
    # 그 거리를 못 가면 실패로 본다(초). **시간이 아니라 실제 이동량**으로 판정한다 —
    #   바퀴가 헛돌아도 성공으로 넘기면 증상이 nav2 "경로 없음"으로 멀리서 나타난다.
    undock_timeout_sec: 8.0
  security_patrol:
    # 15분 야간 루프 — Topics2BB/외부 스케줄러가 security_patrol_request 를 넣어주는 주기.
    # 이 패키지가 타이머 자체를 소유하지 않는다 (IdleBranch 에 타이머 leaf 없음).
    idle_interval_sec: 900
    # 야간 순찰 침입 추종. 숫자는 전부 근거가 있다 —
    # docs/superpowers/specs/2026-08-03-night-patrol-security-design.md §9·§10
    # sqrt(area) @320. ⚠️ 잠정값 — 리허설에서 사람을 여러 거리에 세우고 실측해 확정한다.
    intruder_size: 100.0
    # ⚠️ AI 서버 TRIGGER_SEC(1.0)보다 **길어야 한다.** 두 프로세스는 신호를 주고받지
    #    않고 같은 숫자를 각자 본다 — 이 차이가 "등록이 추종보다 먼저"를 보장하는
    #    유일한 장치다. 같으면 owner 없이 세션이 열려 곧바로 실패한다.
    intruder_sustain: 1.5
    # ⚠️ 유도값: SEARCH_PEEK_ANGLE(1.5708) / ANGULAR_Z_SEARCH(0.35) + 0.5 = 5.0
    #    (libi_perception/config.py:341,360). **9.49 이상으로 올리면** 인지 쪽 탐색이
    #    훑기·180° 회전까지 진입해 로봇이 밤에 제자리에서 빙빙 돈다.
    intruder_lose_sec: 5.0
    # 안전 상한. 넘으면 무조건 순찰 복귀한다.
    max_chase_sec: 60.0
    # follow_stop 발행 후 nav 목표를 다시 내기까지. 이 유예가 없으면 /cmd_vel
    # 발행자가 잠깐 둘이 된다(FleetCmdDriver.stop 은 결과를 안 기다린다).
    release_grace_sec: 1.0
    # 세션이 failure 로 끝났을 때만 건다. 정상 소실에는 안 건다.
    # ⚠️ 0 이면 owner 가 없을 때 트리거→실패→재트리거가 무한 반복해 순찰이 마비된다.
    failure_backoff_sec: 10.0
