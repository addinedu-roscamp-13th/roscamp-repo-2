libi_modes:
  # 관제 패널이 시킨 전이를 이 시간(초)만큼 붙잡는다. 그 동안 BT 는 스스로 상태를 못 바꾼다.
  #
  # 없으면 패널에서 눌러도 같은 tick 에 되돌아가 화면상 아무 일도 안 일어난다:
  #   CHARGING         이미 충전돼 있으면 BatteryCheck(>=40) 이 즉시 통과 → IDLE
  #   SECURITY_PATROL  랩 드라이버가 곧바로 success → SetNextMode(IDLE) → IDLE
  #
  # ⚠️ 로봇이 스스로 못 나가는 것이지 조작이 잠기는 게 아니다 — 사람은 유지 중에도
  #    다른 상태로 바꿀 수 있다(패널 전이는 이 관문을 안 거친다).
  # ⚠️ ERROR·RETURNING 은 막지 않는다(request_transition._ALWAYS_ALLOWED).
  #    고장과 저전압 복귀는 사람이 정한 상태보다 우선한다.
  # 0 이면 기능이 꺼진다(예전 동작).
  #
  # [2026-07-30] 2.0 → 300.0. **2초는 "눈에 보이게"만 하는 값이라 실제로는 못 쓴다.**
  #   실측(pinky-3, 배터리 100%): 관제에서 IDLE 로 보내면
  #     수동 전이 적용 → IDLE   …   2초 뒤   IDLE -> PATROL
  #   즉 IdleBranch 의 `BatteryCheck(>=80 → PATROL)` 이 도크 게이트 없이 걸려 있어
  #   배터리가 충분하면 IDLE 이 2초만 살아 있었다. 관제 화면에서는 "전이가 안 먹는다"로
  #   보였다(수락은 됐는데 로봇이 되돌린 것).
  #
  #   자동 전이 규칙 자체는 **그대로 둔다** — 부팅·충전 후 자동 순회는 계속 필요하다.
  #   대신 사람이 정한 상태가 사람이 다시 바꿀 때까지 남을 만큼 유지 시간을 늘린다.
  #   미루는 것이지 버리는 게 아니라, 유지가 끝나면 원래 자동 전이가 그대로 일어난다.
  manual_hold_sec: 300.0
  battery:
    ready: 40         # CHARGING -> IDLE
    charged: 80       # IDLE -> PATROL (auto, docked only)
    low: 15           # -> RETURNING
  interacting:
    ui_idle_timeout_sec: 20
  working:
    command_timeout_sec: 120
    # NavigationExec 의 도착 판정 반경(m). **fleet_node 의 arrive_radius 와 같은 값을 쓴다.**
    #   같은 뜻("도착했다")을 두 곳이 판단하는데 값이 다르면 반드시 어긋난다.
    #   BT 가 더 관대하면(값이 크면) 관제는 아직 주행 중인데 BT 는 명령을 놓아 버리고,
    #   BT 가 더 엄격하면 관제가 다음 노드를 줬는데 BT 는 이전 목적지를 붙들고 있다.
    #   또 이 값은 **최소 레인(0.062m)보다 작아야** 옆 노드와 구분이 된다.
    #   전체 부등식:
    #     update_min_d(0.02) < xy_goal_tolerance(0.03) < arrive_tolerance_m = arrive_radius(0.05)
    #                                                                       < 최소 레인(0.062)
    arrive_tolerance_m: 0.05
    # 도착하지 않은 채 이 시간이 지나면 같은 목적지로 goal 을 **다시** 낸다.
    #   nav2 주행은 도착 없이 끝날 수 있다(ABORTED, 또는 선점 순간 직전 목표의 완료가
    #   새 목표의 완료로 보고되는 경우). 그때 다시 몰아 줄 주체가 필요하다.
    #   재전송은 **BT 가 해야 한다** — 도착 여부를 아는 건 BT 뿐이라, FMS 가 시간만 보고
    #   보내면 정상 주행 중에도 끼어들어 불필요한 선점을 만든다.
    #   실측 정상 홉은 2~17초다. 그보다 넉넉히 잡는다.
    #
    # [2026-07-28] 10 → 30. **10 은 위 문장과 어긋났다** — 정상 홉 상한(17초)보다 작아서
    #   정상 주행 중에 재전송이 끼어들었다. 재전송은 fleet_link 에서
    #   `NavGoalTracker.begin()` 이 이전 핸들을 먼저 취소하는 경로라(nav_goal_tracker.py:31)
    #   목적지가 바뀔 때의 매끄러운 preemption 과 달리 **주행이 끊긴다.**
    #
    #   특히 회전과 겹쳐 악순환이 됐다: 90° 제자리 회전이 10.5초(당시 0.15 rad/s)인데
    #   재전송이 10.0초에 나가 회전을 취소하고 처음부터 다시 시켰다 — 영영 안 끝났다.
    #   회전 속도도 0.5 rad/s 로 같이 올렸다(nav2_params.yaml max_angular_vel 주석).
    #
    #   대가: 진짜 nav2 ABORTED 뒤 재주행까지 최대 30초 기다린다. 그래도
    #   `arrive_timeout_sec: 60` 이 있어 영구 정지는 안 된다.
    arrive_resend_sec: 30
    # 목적지가 바뀐 뒤 이 시간 안에 도착 못 하면 그 주행을 실패로 본다.
    #   없으면 "아직 가는 중"과 "영영 못 감"이 구별되지 않아 로봇이 조용히 선다.
    arrive_timeout_sec: 60
    # 길잡이(GuideExec) — 안내받는 사람이 안 보인 지 이만큼 지나면 **멈추고 기다린다.**
    #   사람이 서가 뒤로 한 발 들어가거나 카메라가 한두 프레임 놓치는 건 정상이라
    #   곧바로 멈추면 안내가 계속 끊긴다(추종 회복 BT 가 Hold 를 먼저 두는 이유와 같다).
    #   카메라 15fps · 감시 발행 주기를 감안해 몇 초를 준다.
    guide_lost_grace_sec: 3
    # 그렇게 멈춰 기다렸는데도 끝내 안 오면 안내를 끝낸다(FAILURE).
    #   없으면 요청자가 그냥 가버렸을 때 로봇이 목적지 앞에서 영원히 서 있는다.
    guide_lost_timeout_sec: 45
    # 요청자 가시성(`/libi/requester_visible`)의 신선도. 이보다 오래 갱신이 없으면
    # **False(정지)** 로 본다.
    #   ⚠️ None(감시 없음)으로 내리면 안 된다 — GuideExec 이 "감시 없음 → 그냥 주행"으로
    #      읽어서, AI 서버가 죽었을 때 로봇이 사람 없이 계속 몰고 간다.
    #   카메라 15fps + 발행 주기를 감안해 몇 초를 준다.
    requester_ttl_sec: 2.0
    # 요청자가 이보다 작게 보이면(= 멀면) 멈춰 기다린다. bbox 면적(px^2).
    #   "보이나" 만 보면 10m 뒤에 있어도 계속 간다 — 안내가 아니라 혼자 가는 것이다.
    #   ⚠️ **실측 전이라 0(끔)이 기본이다.** 근거 없는 임계로 멈추면 "왜 안 가지"를
    #      찾느라 시간을 버린다. 로봇 앞 적정 거리에서 면적을 재서 채운다.
    guide_far_area_min: 0
    # 앞을 막은 사람이 이보다 크게 보이면(= 가까우면) 멈춘다. 0 이면 끔(기본).
    #   조종하지 않고 **멈추기만** 한다 — 우회는 nav2 가 costmap 으로 한다.
    guide_near_area_max: 0
    # 갈림길에서 잠깐 서서 사람을 확인하는 시간(초). 0 이면 끔.
    #   **모든 노드가 아니라 갈림길만** — arte2 레인이 0.151~0.601m 라 모든 노드에서
    #   서면 1~5초마다 멈춰 안내가 계속 끊긴다.
    guide_junction_hold_sec: 1.0
  returning:
    dock_retry_max: 3
    # 회전 단계(FaceParking/TurnAround)의 각도 허용오차(rad). 약 8.6도.
    yaw_tolerance_rad: 0.15
    # 정렬 후 `is_docked`(실제 도킹 확인)를 기다리는 시간(초).
    #   이 확인을 빼면 로봇이 충전소에 닿지도 않은 채 CHARGING 을 선언한다 —
    #   화면은 멀쩡한데 배터리는 계속 떨어진다.
    dock_confirm_sec: 90.0
  security_patrol:
    # 15분 야간 루프 — Topics2BB/외부 스케줄러가 security_patrol_request 를 넣어주는 주기.
    # 이 패키지가 타이머 자체를 소유하지 않는다 (IdleBranch 에 타이머 leaf 없음).
    idle_interval_sec: 900
