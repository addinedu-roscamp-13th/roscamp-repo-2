# waypoint.yaml — 내비 그래프 (vertices + lanes)
#
# vertices : 명명 위치(노드). {이름: {x, y, yaw}}
#   x, y : map 프레임 좌표 [m]
#   yaw  : 도착 시 바라볼 방향 [rad] (0 = +x, 1.5708 = +y)
# lanes    : 노드를 잇는 방향성 연결. bidirectional=false 면 단방향(from→to)
#
# ※ 지금은 노드(vertices)만 채운다. lanes 는 아래 주석 예시 참고해 나중에 추가.

