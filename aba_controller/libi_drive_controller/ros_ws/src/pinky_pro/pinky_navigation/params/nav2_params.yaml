amcl:
  ros__parameters:
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 1.0   # [2026-07-15] 2.0→1.0  1x2m 방: likelihood field 계산거리 축소(연산↓)
    laser_max_range: 3.0             # [2026-07-15] 100.0→3.0  방 대각선~2.2m, 밖의 잡음/max-range 무시(매칭 정확도↑, 연산↓)
    laser_min_range: 0.05            # [2026-07-15] -1.0→0.05  로봇 몸체/근접 잡음 무시
    laser_model_type: "likelihood_field"
    max_beams: 45                    # [2026-07-15] 60→45  좁은 방은 빔 적게 써도 충분(연산↓)
    max_particles: 800               # [2026-07-15] 2000→800  좁은 공간은 입자 적어도 수렴(연산↓)
    min_particles: 100               # [2026-07-15] 500→100
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.1     # [2026-06-30] 0.0 → 0.1  위치 잃으면 자동 회복(재추정) 활성화
    recovery_alpha_slow: 0.001   # [2026-06-30] 0.0 → 0.001
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.02
    # ⚠️ [2026-07-21] 도착 판정과 물려 있는 값이다. 반드시 이 부등식이 성립해야 한다:
    #      update_min_d  <  fleet_node arrive_radius(0.05)  <  최소 레인 길이(0.062)
    #   위: 도착 반경이 최소 레인보다 크면 안 움직이고 다음 노드를 통과해 버린다.
    #   아래: 위치 갱신이 도착 반경보다 성기면 **도착을 영영 못 본다.**
    #
    #   실측(실물 Pinky-3): 0.10 이었을 때 v13→v14(0.248m) 구간에서
    #     마지막 AMCL 갱신 0.189m 지점 → 남은 0.059m 는 10cm 미만이라 갱신이 안 옴
    #     → 로봇은 v14 에 실제로 도착했는데 보고 위치는 6cm 뒤 → 주문이 영구 정지
    #   AMCL 은 **움직일 때만** 갱신하므로 정지 중 추가 부하는 없다.
    #   0.07m/s 기준 0.29초마다 1회(≈3.5Hz), 파티클 800·빔 45 — Pi 에서 감당 가능.
    update_min_d: 0.02
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan
    set_initial_pose: true
    # [2026-06-30] 리스트 [0,0,0] → 올바른 x/y/yaw 형식으로 수정.
    # 홈 = 맵 제작 시작 지점(맵 좌표 0,0). 이 자리에 로봇을 놓고 켜면 자동으로 위치를 안다.
    # 다른 곳을 홈으로 하려면 그 지점의 맵 좌표로 x, y, yaw 값을 바꾸면 됨.
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: odom
    # [2026-07-30] 10 → 30 (ms). nav2 행동트리 tick 주기다. 기본 10ms = **초당 100번** 트리를
    #   순회한다. 이 로봇은 0.06 m/s 로 1.26×2.16m 맵을 돌고 제어 루프는 10Hz 다 —
    #   100Hz 로 트리를 볼 이유가 없다. 30ms(33Hz)도 제어 루프의 3배다.
    #   실측 근거: Pi 4코어에서 nav2 컨테이너가 CPU 56%, 그중 bt_navigator 가 큰 몫이었고
    #   `Control loop missed its desired rate of 10.0000 Hz` 가 찍혔다(순회가 20초씩 멈춤).
    #   대가: 목표 취소·선점 반응이 최대 30ms 늦어진다(제어 주기 100ms 보다 작다).
    bt_loop_duration: 30
    # ⚠️ nav2 기본값은 20(ms)다. 이 로봇에서는 **너무 짧다.**
    #
    # 2026-07-28 실측: Pi 4코어에 load 21 (camera_sender 44% + fleet_link 33%).
    # 그 상태에서 bt_navigator 가 planner_server 로 재계획을 걸면 20ms 안에
    # goal ack 를 못 받고, 그러면 주행 전체가 abort 된다:
    #   Passing new path to controller  →  Timed out ... compute_path_to_pose
    #   →  Goal failed  →  Cancellation was successful. Stopping the robot.
    # 증상은 "조금 가다 서기를 반복한다"로 보인다. 계획도 제어도 멀쩡한데
    # **응답 대기 시간만 모자란 것**이라 로그를 안 보면 원인이 안 드러난다.
    #
    # 200ms 는 ack 만 기다리는 시간이지 계획 시간이 아니다 — 늘려도 주행이
    # 굼떠지지 않는다. 근본 해결은 CPU 부하를 줄이는 것이다(카메라 fps 등).
    #
    # ── [2026-07-30] 200 → 500. **같은 부류가 다시 났다.** ──────────────────────
    #
    # 이번엔 재계획(compute_path_to_pose) 쪽이 아니라 **취소(halt)** 쪽이다.
    # 웨이포인트마다 새 goal 이 이전 goal 을 preempt 하는데, 그때 BT 가 FollowPath 를
    # halt 하면서 취소 결과를 기다린다. 그 대기에 쓰는 값이 **바로 이 파라미터**다
    # (nav2 `BtActionNode::halt()` → `spin_until_future_complete(future_result,
    #  server_timeout_)`, 실패 시 아래 문구):
    #
    #     [bt_navigator_navigate_to_pose_rclcpp_node]:
    #         Failed to get result for follow_path in node halt!
    #     [navigate_to_pose] [ActionServer] Aborting handle.
    #
    # 그 뒤에 일어나는 일이 사용자가 보는 "또 멈췄다"다:
    #     abort → /cmd_vel 침묵 → 모터 워치독 0.5s 발동 → 약 20초 뒤 **같은 좌표** 재시도
    #
    # 실측(2026-07-30, 순회 중):
    #     GOAL 781.66 (0.60,-0.68) →  802.43 **같은 좌표** (20.8s 뒤)
    #     GOAL 808.21 (0.60,-0.36) →  828.82 **같은 좌표** (20.6s 뒤)
    #     워치독 809.72 · 836.72   (각각 goal 1.5s 뒤)
    #
    # 왜 200ms 로도 모자란가: **처리량이 아니라 순간 지연**이다. 평균은 여유가 있는데
    # (`id` 평균 18%) 2초 간격 연속 기록에서 순간 `id 3.8%` 까지 떨어지고,
    # 38표본 중 29표본(76%)이 `throttled=0xe0008`(소프트 온도제한 활성, 82.7°C 평균)이었다.
    # 클럭이 깎인 순간에 controller_server 가 취소 결과를 200ms 안에 못 돌려준다.
    #
    # ⚠️ 이건 **증상 완화지 근본 치료가 아니다.** 근본은 둘이다:
    #     · 냉각 — 76% 시간 스로틀 중이면 코드로 할 수 있는 건 한계가 있다
    #     · preempt 횟수 자체를 줄이기 — 웨이포인트마다 NavigateToPose 를 새로 던지는 대신
    #       구간을 NavigateThroughPoses 하나로 묶으면 이 관문을 지나는 횟수가 1/N 이 된다
    #       (교통 WAIT 게이트는 구간 경계에 남긴다. fleet_node 는 노드별 물리예약을 한다 —
    #        cbs_traffic.hpp:20, 그래서 경로 전체를 통째로 넘기면 안 된다)
    #
    # ⚠️ 되돌림 신호: 이 값을 올렸는데도 위 ERROR 가 계속 나면 **내 인과가 틀린 것**이다.
    #    그때는 200 으로 되돌리고 halt 가 아닌 다른 경로를 찾아라.
    default_server_timeout: 500
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.

    # plugin_lib_names is used to add custom BT plugins to the executor (vector of strings).
    # Built-in plugins are added automatically
    # plugin_lib_names: []

    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    controller_frequency: 10.0        # [2026-07-20] 20.0 → 10.0  실내 저속 로봇엔 10Hz면 충분, 제어루프 연산 절반(CPU↓)
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"

    # 단일 컨트롤러
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false
    enable_stamped_cmd_vel: false

    # Progress checker
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.15
      movement_time_allowance: 10.0

    # Goal checker
    general_goal_checker:
      # [2026-07-22] True -> False. stateful 은 XY 허용오차를 한 번 만족하면 그 사실을
      #   **기억해** 이후로는 yaw 만 본다(제자리 회전 중 위치가 조금 흔들려도 목표를
      #   놓치지 않게 하려는 장치). 그런데 우리는 노드마다 목표를 **선점(preempt)** 한다 —
      #   fleet_node 는 도착 판정 반경 0.05m 에서 다음 노드를 허가하는데 nav2 는 0.03m
      #   까지 가려 하므로, 매 홉의 마지막 몇 cm 구간에서 반드시 선점이 겹친다.
      #   그 순간 직전 목표의 완료가 **새 목표의 완료로 보고**됐다:
      #     "Begin navigating from (0.34,-1.01) to (0.38,-1.36)" → 40ms 뒤 "Reached the goal!"
      #   로봇은 0.35m 떨어진 채로 주행이 끝나고, 아무도 다시 몰지 않아 그대로 섰다
      #   (실측 2회, 두 번 다 직전 목표에서 0.036~0.037m 지점).
      #   stateful 을 끄면 목표 판정이 매 주기 XY 부터 다시 확인한다.
      stateful: False
      plugin: "nav2_controller::SimpleGoalChecker"
      # ⚠️ [2026-07-21] fleet_node 의 도착 판정(arrive_radius=0.05)보다 **작아야** 한다.
      #   둘이 같으면(0.05=0.05) 여유가 0 이라, nav2 가 5.0cm 지점에서 멈추면
      #   fleet_node 는 "아직 5.0cm" 로 보고 도착을 인정하지 않아 교착에 빠진다
      #   (실측: v13→v4 구간에서 5.27cm 에 선 채 다음 노드로 못 넘어감).
      #   전체 부등식: update_min_d(0.02) < xy_goal_tolerance < arrive_radius(0.05)
      #                                                        < 최소 레인(0.062)
      xy_goal_tolerance: 0.03
      yaw_goal_tolerance: 0.15

    # ★ 여기부터: Regulated Pure Pursuit 컨트롤러 설정
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      # 기본 속도들 (Pinky 상황 맞게 나중에 조정 가능)
      desired_linear_vel: 0.07      # [2026-07-15] 0.09→0.07  더 천천히 주행(좁은 방 정밀·드리프트↓)
      max_linear_accel: 0.3         # [m/s^2]
      max_linear_decel: 0.5         # [m/s^2]
      # [2026-07-28] 0.15 → 0.5. **0.15 는 기능을 망가뜨리고 있었다.**
      #   순회 루트가 지그재그라 노드마다 ~90° 를 도는데
      #     90° = 1.571 / 0.15 = 10.5초,  180° = 21.0초
      #   그런데 `arrive_resend_sec` 이 10초라, 회전이 끝나기 0.5초 전에 재전송이 나가
      #   goal 을 취소하고 회전을 **처음부터 다시** 시킨다 → 영영 안 끝난다.
      #   실측(2026-07-28): `/cmd_vel` linear.x 가 12초 연속 0, 레인 하나에 22~26초.
      #   (같은 로봇의 회복 BT 는 0.55 rad/s 로 훑는다 — 하드웨어는 충분히 낸다)
      max_angular_vel: 0.5

      # 경로 추종 관련
      # [2026-06-30] 1m×2m 작은 맵 + 6cm 로봇에 맞춰 lookahead 축소
      # (기존: lookahead_dist 0.6 / min 0.3 / max 0.9 → 맵 대비 과도해 collision ahead 유발)
      lookahead_dist: 0.20          # 0.6  → 0.20
      min_lookahead_dist: 0.10      # 0.3  → 0.10
      max_lookahead_dist: 0.30      # 0.9  → 0.30
      lookahead_time: 1.5
      transform_tolerance: 0.2
      use_velocity_scaled_lookahead_dist: true
      use_collision_detection: true
      # [2026-06-30] carrot까지 충돌투영 시간 명시 (0.1m/s면 약 0.1m만 투영)
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_interpolation: true

      # ========= 회전 우선 관련 핵심 파라미터 =========
      # 1) 경로 헤딩과 로봇 헤딩 차이가 나면, 먼저 in-place 회전
      use_rotate_to_heading: true

      # 2) 이 각도(rad) 이상 헤딩 차이가 나면 회전 모드 진입
      #    0.785 ≒ 45도, 0.523 ≒ 30도, 0.35 ≒ 20도
      rotate_to_heading_min_angle: 0.35

      # 3) 회전 속도 (in-place 회전일 때 angular vel)
      # [2026-07-28] 0.15 → 0.5. 근거는 위 max_angular_vel 주석(회전 10.5초 vs 재전송 10초).
      #   0.5 면 90° 가 3.1초, 180° 가 6.3초라 재전송 주기 안에 확실히 끝난다.
      rotate_to_heading_angular_vel: 0.5

      # 4) 회전할 때는 전진 속도 0에 가깝게 (거의 제자리 회전)
      max_angular_accel: 3.2
      allow_reversing: false
      use_rotate_to_heading_threshold: 0.15  # 헤딩 오차 이내면 전진으로 전환

      # ========= goal 근처에서 고개 맞추기 =========
      final_rotation_alpha: 1.0
      allow_final_rotation: true
      use_final_rotation: true

      # ========= 안전 관련 =========
      # 장애물과 너무 가까워지면 속도 줄이거나 정지하는 옵션들
      use_approach_velocity_scaling: true
      # [2026-07-22] 목표 근처 감속이 **설정만 되어 있고 실제로는 안 걸리고 있었다.**
      #   approach_velocity_scaling_dist 를 안 적어 RPP 기본값 0.6m 가 쓰였는데,
      #   이 맵은 **최장 레인이 0.581m** 라 모든 주행이 통째로 감속 구간 안에 들어간다.
      #   그러면 scaling 이 늘 작아져 하한(min_approach_linear_velocity)에 걸리고,
      #   결과적으로 속도가 **평평하다가 목표점에서 뚝 끊긴다** — 감속이 아니라 상시 저속이었다.
      #     중앙 레인 0.196m : 0.07 × (0.196/0.6) = 0.023 → 하한 0.05 로 올라붙음
      #   nav2 자신도 이 상황을 경고한다("larger than forward costmap extent → permanent slowdown").
      #
      #   그래서 ① 감속 구간을 맵 축척에 맞춰 좁히고 ② 하한을 실제로 내려간 값으로 낮춘다.
      #   0.12m 는 최단 레인(0.062m)의 두 배쯤 — 짧은 레인은 전 구간 감속, 나머지는
      #   desired_linear_vel 로 달리다 마지막 0.12m 에서 부드럽게 줄어든다.
      #
      # [2026-07-28] 0.12 → 0.16. **사용자 결정** — 노드 근처에서 뚝 끊기지 말고
      #   조금씩 줄어들며 들어가게 한다.
      #
      #   ⚠️ 대가를 알고 쓴다. fleet_node 의 선행 통과(prefetch_radius 0.14,
      #      scripts/laptop/fms_service.sh)보다 **감속이 먼저 시작된다**:
      #        감속 시작 0.16  >  다음 노드 허가 0.14
      #      즉 경유 노드에서도 0.02m 만큼은 감속에 들어간 뒤 새 목표를 받는다.
      #      선행 통과의 "안 서고 이어 달린다" 효과가 그만큼 줄어든다.
      #
      #      prefetch 를 0.16 위로 올려 되살릴 수는 **없다** — fleet_node 가 반경을
      #      레인 길이의 절반으로 깎는데(fleet_node.cpp:679) 순회 레인이 0.32m 라
      #      상한이 정확히 0.16 이다.
      #
      #      노드마다 주춤하는 게 거슬리면 이 값을 0.10 으로 내리는 것이 정답이다
      #      (허가 0.14 밖으로 빠져 경유 노드에서 감속이 아예 안 걸린다).
      approach_velocity_scaling_dist: 0.16
      min_approach_linear_velocity: 0.02   # 0.05 → 0.02  하한이 높으면 감속 자체가 안 보인다
      inflation_cost_scaling_factor: 10.0
      regulated_linear_scaling_min_radius: 0.20   # [2026-06-30] 0.5 → 0.20
      regulated_linear_scaling_min_speed: 0.08
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.10       # [2026-06-30] 0.25 → 0.10
      cost_scaling_gain: 1.5


local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 2.0             # [2026-07-20] 5.0 → 2.0  idle 상시 costmap 재계산 부하↓ (실내 저속 로봇엔 충분)
      publish_frequency: 1.0            # [2026-07-20] 2.0 → 1.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      # [2026-07-28] 3 → 2. **로컬 창이 맵 전체보다 컸다.**
      #   맵 arte3 = 63×108 px @ 0.02m = 1.26m × 2.16m = 6,804 셀
      #   3×3 창   = 150×150 @ 0.02m                   = 22,500 셀  ← 맵의 3.3배
      #   2×2 창   = 100×100                           = 10,000 셀
      # 매 update(2Hz)마다 이 셀 전부에 장애물 표시 + 인플레이션을 돈다. 2.25배 줄었다.
      #
      # 2m(반경 1.0m)로 잡은 근거 — 필요 반경은
      #   RPP max_lookahead_dist 0.30 (:159) + 인플레 0.09 + 로봇반경 0.06 = 0.45
      #   + backup 회복 0.15  →  최악 0.60m
      # 이라 1m 창(반경 0.5m)은 **모자라고** 2m 창이 최소 안전값이다.
      #
      # ⚠️ **정수만 받는다.** nav2 가 `int map_width_meters_` 로 선언한다
      #    (/opt/ros/jazzy/include/nav2_costmap_2d/nav2_costmap_2d/costmap_2d_ros.hpp:399,402).
      #    1.5 같은 실수를 쓰면 파라미터 타입 불일치로 **costmap 이 아예 안 뜬다.**
      width: 2
      height: 2
      resolution: 0.02
      robot_radius: 0.06        # [2026-07-15] 0.11 → 0.06 되돌림 — 실물 바퀴간격 0.0961m 기준. inflation(0.08)보다 크면 감쇠구간이 사라져 8cm 띠 전체가 253(통행불가)이 된다
      #footprint: '[[0.06, 0.06], [0.06, -0.06], [-0.06, -0.06], [-0.06, 0.06]]'
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0      # [2026-06-30] 10.0 → 5.0
        # [2026-07-28] 0.08 → 0.09. nav2 1.3.12 로 올린 뒤 기동이 SIGABRT 로 죽었다:
        #   ERROR: configured inflation radius (0.080) is smaller than the computed
        #          inscribed radius (0.088) of your footprint
        # inscribed = robot_radius(0.06) + footprint_padding(0.03) 근사 ≈ 0.088 이라
        # 그보다 커야 한다. 맵 여유(0.04~0.18)를 최대한 지키려고 딱 넘기는 값으로 둔다.
        inflation_radius: 0.09        # [2026-07-15] 0.20 → 0.08 되돌림 — 맵 여유(0.04~0.18m)보다 커서 자유공간이 전부 덮였음
      # [2026-07-20] voxel_layer(3D VoxelLayer) → obstacle_layer(2D) 교체.
      # 관측원이 2D 라이다(/scan_filtered) 하나뿐이라 3D 복셀·복셀맵 발행이 불필요한 CPU 낭비였음.
      # global_costmap 의 obstacle_layer 와 동일 설정. 장애물 표시/회피 동작은 그대로.
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan_filtered
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      footprint_padding: 0.03
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      robot_radius: 0.06        # [2026-07-15] 0.11 → 0.06 되돌림 — 실물 바퀴간격 0.0961m 기준. inflation(0.08)보다 크면 감쇠구간이 사라져 8cm 띠 전체가 253(통행불가)이 된다
      #footprint: '[[0.06, 0.06], [0.06, -0.06], [-0.06, -0.06], [-0.06, 0.06]]'
      resolution: 0.02
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan_filtered
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0      # [2026-06-30] 10.0 → 5.0
        # [2026-07-28] 0.08 → 0.09. nav2 1.3.12 로 올린 뒤 기동이 SIGABRT 로 죽었다:
        #   ERROR: configured inflation radius (0.080) is smaller than the computed
        #          inscribed radius (0.088) of your footprint
        # inscribed = robot_radius(0.06) + footprint_padding(0.03) 근사 ≈ 0.088 이라
        # 그보다 커야 한다. 맵 여유(0.04~0.18)를 최대한 지키려고 딱 넘기는 값으로 둔다.
        inflation_radius: 0.09        # [2026-07-15] 0.20 → 0.08 되돌림 — 맵 여유(0.04~0.18m)보다 커서 자유공간이 전부 덮였음
      always_send_full_costmap: True

# The yaml_filename does not need to be specified since it going to be set by defaults in launch.
# If you'd rather set it in the yaml, remove the default "map" value in the tb3_simulation_launch.py
# file & provide full path to map below. If CLI map configuration or launch default is provided, that will be used.
# map_server:
#   ros__parameters:
#     yaml_filename: ""

map_saver:
  ros__parameters:
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.1      # [2026-07-15] 0.5→0.1  1x2m 좁은 방: 목표 정밀 도달
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2
    enable_stamped_cmd_vel: false

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 10.0         # [2026-07-20] 20.0 → 10.0  cmd_vel 스무딩 루프 절반(CPU↓)
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.25, 0.0, 1.5]
    min_velocity: [-0.25, 0.0, -1.5]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

# ⚠️ [2026-07-28] **이 노드는 지금 안 뜬다.** navigation_launch.xml 에서 뺐다 —
#    폴리곤이 둘 다 enabled:False 라 cmd_vel_smoothed → cmd_vel 통과만 하고 있었고,
#    그 자리는 velocity_smoother 의 `cmd_vel_smoothed → cmd_vel` 리맵이 대신한다.
#    아래 설정은 **되살릴 때 쓰라고 남겨 둔 것**이다. 되살리는 절차는
#    navigation_launch.xml 머리말의 ①②③ 참고(세 곳을 같이 되돌려야 한다).
collision_monitor:
  ros__parameters:
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"   # velocity_smoother 출력을 받아서
    cmd_vel_out_topic: "cmd_vel"           # 걸러 로봇으로 내보냄
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    polygons: ["SlowDown", "Stop"]

    # ⚠️⚠️ 2026-07-21: 배차·교통 알고리즘 시험을 위해 **실물에서도** 두 zone 을 비활성했다.
    # 좁은 통로 + 라이다 노이즈로 Stop zone 이 계속 걸려 로봇이 제자리에 서는 것을 막기 위함.
    #
    # 🚨 이건 **원시 스캔 기반 비상정지(마지막 방어선)를 끈 것**이다. 실물 로봇이 사람이
    #    있는 공간에서 도는 운영 상황으로 돌아갈 때는 **반드시 enabled: True 로 되돌린다.**
    #
    # ⚠️ 노드 자체는 끄면 안 된다 — collision_monitor 는 cmd_vel_smoothed → cmd_vel 경로
    # 한가운데 있어서, 노드를 빼면 cmd_vel 이 아예 발행되지 않아 로봇이 전혀 못 움직인다.
    # 그래서 폴리곤만 enabled: False 로 둔다(통과만 시킴).
    #
    # 남아 있는 보호: nav2 local costmap + controller 장애물 회피,
    # FMS fleet_coordinator 근접 안전, fleet_node 교통 예약, libi_gui 비상정지.
    SlowDown:
      type: "polygon"
      points: "[[0.15, 0.12], [0.15, -0.12], [-0.10, -0.12], [-0.10, 0.12]]"
      action_type: "slowdown"
      min_points: 4
      slowdown_ratio: 0.7
      visualize: True
      polygon_pub_topic: "slowdown_polygon"
      enabled: False

    Stop:
      type: "polygon"
      points: "[[0.08, 0.08], [0.08, -0.08], [-0.06, -0.08], [-0.06, 0.08]]"
      action_type: "stop"
      min_points: 4
      visualize: True
      polygon_pub_topic: "stop_polygon"
      enabled: False

    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/scan_filtered"    # costmap과 동일 소스 (안전 더 원하면 /scan)
      min_height: 0.05
      max_height: 0.5
      enabled: True
    enable_stamped_cmd_vel: false
