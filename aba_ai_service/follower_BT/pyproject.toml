[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "follower_BT"
version = "0.1.0"
description = "Independent drive state machine + recovery search behavior (swappable for follower_control BT)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["follower_BT*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
