[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "follower_perception"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "opencv-python",
    "ultralytics",
]

[tool.setuptools.packages.find]
include = ["follower_perception*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
