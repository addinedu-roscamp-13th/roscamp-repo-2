# ⚠️ 더 이상 직접 관리하지 않는다 (2026-07-20).
#    도메인이 손으로 박혀 있어 관제 패널에서 domain_id 를 바꿔도 반영되지 않았고,
#    실제로 Pinky-3 이 DB 119 / 이 파일 87 로 어긋난 채 방치돼 있었다.
#    이제 DB(rc_robots)가 유일한 출처다:
#        python3 scripts/gen_domain_bridges.py --check   # DB 값 확인
#        python3 scripts/gen_domain_bridges.py --run     # 생성 + 기동
#    생성물은 config/generated/ 에 나오며 이 파일은 참고용으로만 남긴다.
#
# 로봇1(Pinky-1, 192.168.0.28, ROS_DOMAIN_ID=88) ↔ 서버 도메인 86 중계.
# 텔레메트리/상태(88→86, /pinky1/* 개명)와 명령(86→88, reversed)을 함께 담당한다.
# 로봇은 무수정 — 서버에서만 실행: ros2 run domain_bridge domain_bridge <이 파일>
# QoS 는 publisher 자동 매칭(기본값)을 사용한다 (amcl_pose·map·fleet_status 는 TRANSIENT_LOCAL).
name: bridge_pinky1
from_domain: 88
to_domain: 86
topics:
  amcl_pose:
    type: geometry_msgs/msg/PoseWithCovarianceStamped
    remap: /pinky1/amcl_pose
  map:
    type: nav_msgs/msg/OccupancyGrid
    remap: /pinky1/map
  plan:
    type: nav_msgs/msg/Path
    remap: /pinky1/plan
  battery/percent:
    type: std_msgs/msg/Float32
    remap: /pinky1/battery/percent
  battery/voltage:
    type: std_msgs/msg/Float32
    remap: /pinky1/battery/voltage
  # ── fleet link (robot_agent app/core/fleet_link.py, 2026-07-08) ──
  fleet_status:
    type: std_msgs/msg/String
    remap: /pinky1/fleet_status
  fleet_costmaps:
    type: std_msgs/msg/String
    remap: /pinky1/fleet_costmaps
  fleet_cmd_result:
    type: std_msgs/msg/String
    remap: /pinky1/fleet_cmd_result
  # 역방향 명령: 86의 /pinky1/fleet_cmd 구독 → 88에 /fleet_cmd 발행
  pinky1/fleet_cmd:
    type: std_msgs/msg/String
    reversed: True
    remap: /fleet_cmd
  # 역방향 속도 명령: 86의 /pinky1/cmd_vel 발행 → 로봇 도메인의 /cmd_vel
  pinky1/cmd_vel:
    type: geometry_msgs/msg/Twist
    reversed: True
    remap: /cmd_vel

  # ── libi_modes 미션 FSM (2026-07-20) ─────────────────────────────────────────
  # 상태·BT 스냅샷은 payload 안에 robot_id 가 들어 있어 서버에서 토픽을 나누지 않는다
  # (fsm_link 가 robot_id 로 캐시를 가른다) — 로봇이 여러 대여도 같은 토픽에 모인다.
  libi/fsm_state:
    type: std_msgs/msg/String
    remap: /libi/fsm_state
  libi/bt_snapshot:
    type: std_msgs/msg/String
    remap: /libi/bt_snapshot
  libi/fsm_transition_result:
    type: std_msgs/msg/String
    remap: /libi/fsm_transition_result
  # 역방향: 서버(86)의 전이 요청을 로봇 도메인으로. domain_bridge 는 서비스를 중계하지
  # 못하므로(YAML 에 services 키 없음) 상관 id 를 실은 요청/결과 토픽 쌍을 쓴다.
  libi/fsm_transition_request:
    type: std_msgs/msg/String
    reversed: True
    remap: /libi/fsm_transition_request
